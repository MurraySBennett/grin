# Trusted publishing to PyPI on a GitHub release. No API token is stored: PyPI is
# configured to trust this repo/workflow via OIDC. This file is INACTIVE until you
# (a) register the project on PyPI, (b) add this repo as a trusted publisher, and
# (c) publish a GitHub release. Building on every release is safe; it will fail
# loudly at the publish step until trusted publishing is configured.
name: publish

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
