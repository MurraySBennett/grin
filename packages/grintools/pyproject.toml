[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grintools"
version = "0.1.0"
description = "Amortised, uncertainty-calibrated inference for General Recognition Theory (GRT) from a 2x2 identification confusion matrix -- milliseconds instead of maximum-likelihood fitting, via a neural network trained once on simulated data and shipped as an ONNX graph."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Murray S. Bennett", email = "murray.bennett92@gmail.com"},
    {name = "Peter D. Kvam"},
    {name = "Joseph W. Houpt"},
]
keywords = ["general recognition theory", "GRT", "simulation-based inference",
            "amortised inference", "psychophysics", "perceptual independence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "onnxruntime>=1.17"]

[project.optional-dependencies]
train = ["torch>=2.1"]                        # only needed to re-export the ONNX, not to use it
plot = ["matplotlib>=3.5", "pandas>=1.4", "scipy>=1.8"]   # grintools.plot: individual + group reporting

[project.scripts]
grin-fit = "grintools.cli:main"

[project.urls]
Homepage = "https://grin.murraysbennett.com"
Source = "https://github.com/MurraySBennett/grin"

[tool.setuptools.packages.find]
include = ["grintools*"]

[tool.setuptools.package-data]
grintools = ["models/*.onnx", "data/*.csv", "py.typed"]
