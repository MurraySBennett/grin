name: Deploy to S3

# Triggers on every push to the main branch.
# To deploy: commit your changes and push to main (or merge a PR into main).
#
# UNLIKE a repo where the root IS the site: grin's deployable content lives in
# web/ only. src/, data/, results/, scripts/, and everything else at the repo
# root is the model/training project and must NEVER be synced to the bucket —
# every command below is scoped to web/ specifically, on purpose. If you ever
# add a step here, keep that scoping; a bare `aws s3 sync . s3://...` in this
# repo would publish the entire private source tree.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync web/ to S3 and invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1b. Smoke-check web/ artifacts BEFORE uploading. Catches the silent
      #     "model missing from the commit" failure mode early -- and, since the
      #     .onnx files ship with a 1-year immutable cache header (step 3b), the
      #     rather worse "shipped the wrong bytes" one, which is unrecoverable
      #     for up to a year in a visitor's browser.
      #
      #     The .onnx filenames are deliberately NOT hardcoded here: they carry a
      #     version (npe_model.v1.0.0.onnx) so that an immutable cache can never
      #     serve stale weights, which means the manifest is the only thing that
      #     knows the current name. scripts/export_onnx.py --install writes both.
      - name: Smoke-check web/ artifacts
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/analyse.html
          test -f web/explore.html
          test -f web/components/nav.html
          test -f web/components/footer.html
          test -f web/assets/js/grin-shell.js
          test -f web/assets/js/grin-model.js
          test -f web/assets/js/pages/analyse.js
          test -f web/assets/models/cm/manifest.json
          test -f web/assets/models/cmrt/manifest.json
          test -f web/assets/vendor/ort/ort.min.js
          test -f web/assets/vendor/ort/ort-wasm-simd.wasm
          test -f web/assets/images/favicon.svg
          python3 - <<'PY'
          import hashlib, json, pathlib, sys

          failures = []

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for block in iter(lambda: fh.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          for d in ("cm", "cmrt"):
              base = pathlib.Path("web/assets/models") / d
              mf = json.loads((base / "manifest.json").read_text())

              for k in ("id", "file", "version", "inputs", "outputs", "params", "training"):
                  if k not in mf:
                      failures.append(f"{d}: manifest is missing required key {k!r}")
              if "file" not in mf:
                  continue

              onnx = base / mf["file"]
              if not onnx.is_file():
                  failures.append(f"{d}: manifest names {mf['file']!r} but that file is not in the commit")
                  continue
              if onnx.stat().st_size <= 1000:
                  failures.append(f"{d}: {onnx} looks empty ({onnx.stat().st_size} bytes)")

              # Integrity. The hash is written by scripts/export_onnx.py --install;
              # a mismatch means the manifest and the weights came from different
              # exports, which is precisely the state that must never reach a cache
              # header of max-age=31536000.
              declared = str(mf.get("artifact_sha256", "")).lower()
              if not declared:
                  failures.append(f"{d}: manifest has no artifact_sha256")
              else:
                  actual = sha256(onnx)
                  if actual != declared:
                      failures.append(
                          f"{d}: sha256 mismatch for {mf['file']}\n"
                          f"      manifest declares {declared}\n"
                          f"      file on disk is   {actual}\n"
                          f"      Re-run: python scripts/export_onnx.py"
                          f"{' --rt' if d == 'cmrt' else ''} --install --version <ver>"
                      )

              # Placeholder provenance must not ship. These are the exact sentinel
              # values the pre-release manifests carried.
              status = str(mf.get("training", {}).get("provenance_status", ""))
              if status in ("", "unverified_legacy_checkpoint") or "legacy" in status:
                  failures.append(
                      f"{d}: provenance_status is {status!r} -- this is a placeholder "
                      f"checkpoint, not a release. Export a real one before deploying."
                  )
              if str(mf.get("version", "")).startswith("0.0.0-preview"):
                  failures.append(f"{d}: version is still the placeholder {mf['version']!r}")

              # Versioned filename: a hard requirement given step 3b's cache header.
              if mf["file"] in ("npe_model.onnx", "npe_rt_model.onnx"):
                  failures.append(
                      f"{d}: {mf['file']!r} is unversioned. Step 3b ships .onnx with "
                      f"max-age=31536000, immutable, so overwriting a fixed filename "
                      f"leaves returning visitors on the old weights for up to a year."
                  )

              if status == "preview":
                  print(f"  note: {d} is shipping as a PREVIEW ({mf.get('version')}) -- allowed, but not a release.")

          # Cross-check against the run manifest, when the release recorded one:
          # proves the shipped weights are the ones the pipeline run produced,
          # not a stray file that happened to be in the tree.
          rm = pathlib.Path("results/run_manifest.json")
          if rm.is_file():
              run = json.loads(rm.read_text())
              tier1 = [a for a in run.get("artifacts", []) if a.get("tier") == 1]
              checked = 0
              for a in tier1:
                  path = pathlib.Path(a["path"])
                  if not path.is_file() or "sha256" not in a:
                      continue
                  if sha256(path) != a["sha256"]:
                      failures.append(
                          f"{a['path']} does not match results/run_manifest.json "
                          f"(run {run.get('run_id')})"
                      )
                  checked += 1
              print(f"  cross-checked {checked} tier-1 artifact(s) against run {run.get('run_id')}")
          else:
              print("  note: no results/run_manifest.json -- skipping run cross-check.")

          if failures:
              print("\nweb smoke check FAILED:")
              for f in failures:
                  print("  - " + f)
              sys.exit(1)
          print("web smoke check ok")
          PY

      # 2. Configure AWS credentials from GitHub Secrets.
      #    You must add these three secrets in your GitHub repo:
      #    Settings → Secrets and variables → Actions → New repository secret
      #    - AWS_ACCESS_KEY_ID
      #    - AWS_SECRET_ACCESS_KEY
      #    - AWS_REGION (e.g. us-east-1)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Sync web/ to S3, in three passes by how long a given file is safe
      #    to cache. This is the one place this workflow deviates from the
      #    plain "HTML no-cache, everything else 1 year" pattern: the JS/CSS/
      #    manifests here change on nearly every deploy right now, and
      #    CloudFront invalidation only clears the CDN edge, never a
      #    visitor's own browser cache. A 1-year immutable header on files
      #    that are NOT actually immutable means a returning visitor can
      #    silently keep running week-old JS against today's HTML, with no
      #    error anywhere. Reserve the long cache for things that only change
      #    when you deliberately replace them.

      # 3a. HTML: no-cache, always revalidated. A deploy must be visible
      #     immediately, since the HTML is what references everything else.
      - name: Sync HTML (no-cache)
        run: |
          aws s3 sync web/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      # 3b. Genuinely immutable binaries: the vendored ONNX runtime and the
      #     trained model weights. These only change when you intentionally
      #     replace them -- if you ever DO replace an .onnx file without
      #     renaming it, drop this step's cache TTL for that one deploy, or
      #     CloudFront/browsers will keep serving the old weights.
      - name: Sync model weights + ONNX runtime (long cache)
        run: |
          aws s3 sync web/assets/models s3://${{ secrets.S3_BUCKET_NAME }}/assets/models \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/octet-stream" \
            --exclude "*" --include "*.onnx" \
            --delete

          aws s3 cp web/assets/vendor/ort/ort-wasm-simd.wasm \
            s3://${{ secrets.S3_BUCKET_NAME }}/assets/vendor/ort/ort-wasm-simd.wasm \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/wasm"

          aws s3 cp web/assets/vendor/ort/ort.min.js \
            s3://${{ secrets.S3_BUCKET_NAME }}/assets/vendor/ort/ort.min.js \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript"

      # 3c. Everything else: JS, CSS, JSON manifests, images, audio. Short
      #     cache, so a stale copy in a visitor's browser self-corrects
      #     within the hour instead of persisting for up to a year.
      - name: Sync remaining assets (short cache)
        run: |
          aws s3 sync web/assets s3://${{ secrets.S3_BUCKET_NAME }}/assets \
            --exclude "*.html" \
            --exclude "models/*.onnx" \
            --exclude "vendor/ort/ort-wasm-simd.wasm" \
            --exclude "vendor/ort/ort.min.js" \
            --cache-control "public, max-age=3600" \
            --delete

      # 4. Invalidate the CloudFront distribution so the CDN edge sees the
      #    new HTML immediately. (This does not reach visitors' own browser
      #    caches -- see the cache-tiering note above.) Add this secret too:
      #    - CLOUDFRONT_DISTRIBUTION_ID
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

