name: Test

# Runs the full test suite on every push/PR. Four independent jobs, because they
# have very different dependency footprints and failure modes:
#   - python-and-web: the research repo's Python unit tests + the JS web-app port,
#     checked against the same Python package (tests/gen_reference.py etc. import
#     src/ directly, so a divergence fails loudly here rather than silently).
#   - grintools: the standalone PyPI package, matrixed across Python versions and
#     OSes because that is exactly what "pip install grintools" needs to work on.
#     Installed as a real wheel and run from an empty directory, not the repo
#     checkout -- a real bug this avoided during development (a bare grintools/
#     folder in the working directory shadowed the installed package via Python's
#     implicit namespace-package resolution), not paranoia. Two smoke tests run
#     this way: the core package (test_packaged.py) and, with the [plot] extra
#     installed, the plotting suite (test_plot.py) -- added 2026-08-13 after an
#     external review noted the plotting suite had never actually run in CI.
#   - r-package-cran-conditions: R CMD check --as-cran with libtorch deliberately
#     ABSENT, which is the environment CRAN actually checks in. Deterministic, and
#     the job that has to stay green for a CRAN submission to survive.
#   - r-package: the native-R companion, via devtools::check() (0 errors/warnings
#     is the bar; a sandbox "unable to verify current time" NOTE is unavoidable and
#     not a failure). torch::install_torch() downloads libtorch (~500MB); the
#     inference/parity tests skip gracefully if that step fails rather than failing
#     the whole job -- a deliberate choice, so a flaky download degrades coverage,
#     not the build. That used to be silent; a step now checks whether torch
#     actually installed and emits a loud ::warning:: annotation if not, so a
#     degraded run is visible in the checks UI instead of only in the log.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the research package
        run: pip install -e .
      - name: Install test dependencies
        run: pip install pytest
      - name: Python unit tests (generator, GRT model)
        run: pytest tests/test_grt_model.py tests/test_generator.py -v
      - name: JS web-app port vs. the Python reference
        run: bash tests/run_web.sh

  grintools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel
        run: |
          pip install build
          python -m build packages/grintools
          pip install packages/grintools/dist/*.whl
        shell: bash
      - name: Install test dependencies
        run: pip install pytest
      - name: Smoke test, run OUTSIDE the repo (avoids any packages/grintools shadowing the installed package)
        run: |
          mkdir "$RUNNER_TEMP/grintools_smoketest"
          cp packages/grintools/tests/test_packaged.py "$RUNNER_TEMP/grintools_smoketest/"
          cd "$RUNNER_TEMP/grintools_smoketest" && pytest test_packaged.py -v
        shell: bash
      - name: Install the [plot] extra
        run: pip install "grintools[plot]"
      - name: Plotting suite, same outside-the-repo isolation as the core smoke test
        run: |
          cp packages/grintools/tests/test_plot.py "$RUNNER_TEMP/grintools_smoketest/"
          cd "$RUNNER_TEMP/grintools_smoketest" && pytest test_plot.py -v
        shell: bash

  # CRAN's check machines have no libtorch: the 'torch' package downloads it on
  # first USE, not at install, and CRAN cannot download during a check. This job
  # reproduces that exact condition and is the one that must stay green for the
  # CRAN submission to survive. The r-package job below is the complementary case
  # (libtorch present, so inference actually runs).
  #
  # Kept separate and deterministic on purpose: r-package installs libtorch
  # best-effort, so when the download fails it silently becomes this check. That
  # makes "the CRAN path works" an accident of network luck rather than a fact.
  r-package-cran-conditions:
    runs-on: ubuntu-latest
    env:
      TORCH_INSTALL: "0"   # never auto-download libtorch in this job
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/grin
          extra-packages: any::rcmdcheck
      # Asserting absence is not enough: setup-r-dependencies caches the R library,
      # and the sibling r-package job installs libtorch INTO that library, so the
      # restored cache can carry it here. Remove it, then assert. TORCH_INSTALL=0
      # stops torch re-downloading it during the check.
      - name: Force libtorch absent (that is the point of this job)
        run: |
          Rscript -e '
            lib <- file.path(torch::torch_install_path(), "lib")
            if (dir.exists(lib)) { unlink(lib, recursive = TRUE); cat("removed cached libtorch at", lib, "\n") }
            if (isTRUE(torch::torch_is_installed(recheck = TRUE))) stop("libtorch still present after removal")
            cat("libtorch confirmed absent -- checking as CRAN would\n")'
        working-directory: packages/grin
      # No args override: the action already defaults to c("--no-manual", "--as-cran").
      # Passing just c("--as-cran") re-enables the PDF manual, which needs LaTeX the
      # runner does not have -- that fails the job on the manual, not on the package.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/grin
          error-on: '"warning"'

  r-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/grin
          extra-packages: any::rcmdcheck
      - name: Install libtorch (best-effort -- inference tests skip gracefully if this fails)
        continue-on-error: true
        run: |
          Rscript -e 'torch::install_torch()'
        working-directory: packages/grin
      - name: Flag it loudly if libtorch didn't actually install
        run: |
          if Rscript -e 'quit(status = if (isTRUE(torch::torch_is_installed())) 0 else 1)'; then
            echo "libtorch OK -- inference/parity tests will run for real this build."
          else
            echo "::warning::libtorch did not install -- this build's R inference/parity tests were SKIPPED, not run. Coverage is degraded for this run; re-run the workflow if you need it verified."
          fi
        working-directory: packages/grin
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/grin
          error-on: '"warning"'
