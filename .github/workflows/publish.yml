# Trusted publishing of the grintools package to PyPI, on a published GitHub release.
# No API token is stored: PyPI is configured to trust this repo/workflow over OIDC.
#
# INACTIVE until you (a) register `grintools` on PyPI, (b) add MurraySBennett/grin
# with workflow `publish.yml` as a trusted publisher, and (c) publish a release.
# Until then it builds and checks fine and fails loudly at the publish step.
#
# NOTE ON PATHS: this workflow runs from the repository root, NOT from the directory
# it lives in. Every build/upload step below is scoped to packages/grintools on
# purpose. A bare `python -m build` here would build the ROOT setup.py -- which is
# `grin-pipeline`, the training/validation code, not the distributable tool.
name: publish

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build grintools sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build packages/grintools

      # A release tagged v0.1.0 that ships 0.2.0 makes every version claim in the
      # paper false, and nothing downstream can detect it. Fail here instead.
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('packages/grintools/pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::release tag ($tag) does not match grintools version ($ver)"
            exit 1
          fi

      - name: Check metadata
        run: |
          python -m pip install twine
          twine check packages/grintools/dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/grintools/dist/
